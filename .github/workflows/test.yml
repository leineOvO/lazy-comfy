name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS 单独列出来是必须的：看起来「POSIX 兼容」的地方，实际差异常常出现在
        # 进程表 / cwd / 信号投递上（历史上就有一条用例只在 Linux 挂）。
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
