name: macos-probe

# 临时探针：只跑 echo，不碰项目代码。
# 目的：区分「macOS runner 拿不到」是账号/基础设施问题，还是本项目测试的问题。
on:
  push:
    paths:
      - '.github/workflows/macos-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - run: |
          echo "macOS runner 拿到了"
          uname -a
          sw_vers
          node -v || echo "no node"
